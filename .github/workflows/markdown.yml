name: Markdown

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      BUNDLE_PATH: vendor/bundle
      BUNDLE_FROZEN: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Linux SQLite CLI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 openssl
      - name: Install macOS SQLite CLI
        if: runner.os == 'macOS'
        run: brew install sqlite
      - name: Set up Ruby from .ruby-version
        uses: ruby/setup-ruby@v1
      - name: Install locked dependencies without a Gem cache
        run: bundle install
      - name: Validate documentation and phase prerequisites
        run: |
          bundle exec rake test
          git diff --exit-code -- Gemfile.lock
